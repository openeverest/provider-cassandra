---
# Reusable workflow — run one chainsaw e2e-cluster suite inside a k3d cluster.
# Unlike integration tests, these deploy the bundled k8ssandra-operator and run
# real Cassandra pods. Called by ci.yaml; not triggered directly.
#
# The OpenEverest controller is deployed before the provider because its
# deploy-test-controller target installs cert-manager, which the
# k8ssandra-operator webhooks need.
name: E2E cluster test

on:
  workflow_call:
    inputs:
      make_target:
        description: 'Make target for the chainsaw suite (e.g. test-e2e-cluster-lifecycle)'
        type: string
        required: true
      suite:
        description: 'Human-readable suite name used for artifact naming'
        type: string
        required: true

permissions:
  contents: read

env:
  IMG: provider-cassandra:ci
  # Branch of openeverest/openeverest to build the platform from.
  OPENEVEREST_BRANCH: main

jobs:
  run:
    name: ${{ inputs.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout OpenEverest
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: openeverest/openeverest
          ref: ${{ env.OPENEVEREST_BRANCH }}
          path: _openeverest

      - name: Install Kubernetes tooling
        uses: ./.github/actions/setup-k8s-tools
        with:
          install-k3d: 'true'
          install-chainsaw: 'true'

      - name: Create k3d cluster
        run: |
          sudo modprobe br_netfilter
          make k3d-cluster-up

      - name: Build provider image
        run: make docker-build

      - name: Import image into k3d
        run: make load-image

      - name: Build OpenEverest controller
        working-directory: _openeverest
        run: make build-controller

      - name: Build OpenEverest controller Docker image
        working-directory: _openeverest
        run: make docker-build-controller

      - name: Import OpenEverest controller image into k3d
        run: make load-openeverest-controller-image

      - name: Install CRDs
        run: make install-crds
        env:
          OPENEVEREST_BRANCH: ${{ env.OPENEVEREST_BRANCH }}

      - name: Deploy OpenEverest controller
        working-directory: _openeverest
        run: make deploy-test-controller

      - name: Deploy provider with k8ssandra-operator
        run: make deploy-provider-e2e

      - name: Run ${{ inputs.make_target }}
        run: make ${{ inputs.make_target }}

      - name: Upload chainsaw report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chainsaw-${{ inputs.suite }}-${{ github.run_id }}
          path: /tmp/chainsaw-report*.xml
          retention-days: 7
