# Points at the MinIO from dev/resources/minio.yaml, which pre-creates the
# "backups" bucket.
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: minio-storage
spec:
  type: s3
  s3:
    bucket: backups
    region: us-east-1
    endpointURL: http://minio.minio.svc.cluster.local:9000
    forcePathStyle: true
    verifyTLS: false
    credentialsSecretRef:
      name: minio-credentials
