# Points at the SeaweedFS from dev/resources/seaweedfs.yaml, which pre-creates the
# "backups" bucket.
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-credentials
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: seaweedfsadmin
  AWS_SECRET_ACCESS_KEY: seaweedfsadmin
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: seaweedfs-storage
spec:
  type: s3
  s3:
    bucket: backups
    region: us-east-1
    endpointURL: http://seaweedfs.seaweedfs.svc.cluster.local
    forcePathStyle: true
    verifyTLS: false
    credentialsSecretRef:
      name: seaweedfs-credentials
