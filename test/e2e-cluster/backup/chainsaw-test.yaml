---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: backup
spec:
  description: |
    Back up a real Cassandra cluster to SeaweedFS with Medusa: write a row, take an
    on-demand backup, write another row, restore in place and check only the
    first row is back, then check a scheduled backup runs and is mirrored as a
    Backup.

  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,k8ssandracluster,cassandradatacenter,backup,restore,medusabackupjob,medusabackup,medusarestorejob,medusabackupschedule,pod -o yaml
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-cassandra
        tail: 100
    - podLogs:
        selector: cassandra.datastax.com/cluster=cass-backup
        container: medusa
        tail: 100

  steps:
    - name: operator-deployed
      try:
        - script:
            content: kubectl -n provider-system wait --for=condition=available deploy --all --timeout=5m

    - name: deploy-seaweedfs
      try:
        - script:
            content: |
              kubectl apply -f ${PROVIDER_ROOT_PATH}/dev/resources/seaweedfs.yaml
              kubectl -n seaweedfs rollout status deploy/seaweedfs --timeout=3m
      cleanup:
        - script:
            content: kubectl delete -f ${PROVIDER_ROOT_PATH}/dev/resources/seaweedfs.yaml --ignore-not-found

    - name: setup-storage
      try:
        - apply:
            file: 10-setup-storage.yaml

    - name: create-instance
      try:
        - apply:
            file: 11-create-instance.yaml
        - assert:
            timeout: 15m
            file: 11-assert.yaml

    - name: write-data
      try:
        - script:
            content: |
              ${PROVIDER_ROOT_PATH}/test/e2e-cluster/cql.sh $NAMESPACE cass-backup "
                CREATE KEYSPACE IF NOT EXISTS e2e WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};
                CREATE TABLE IF NOT EXISTS e2e.kv (k text PRIMARY KEY, v text);
                INSERT INTO e2e.kv (k, v) VALUES ('before-backup', 'kept');"

    - name: on-demand-backup
      try:
        - apply:
            file: 20-create-backup.yaml
        - assert:
            file: 20-assert.yaml

    - name: write-after-backup
      try:
        - script:
            content: |
              ${PROVIDER_ROOT_PATH}/test/e2e-cluster/cql.sh $NAMESPACE cass-backup \
                "INSERT INTO e2e.kv (k, v) VALUES ('after-backup', 'dropped');"

    - name: restore
      try:
        - apply:
            file: 30-create-restore.yaml
        - assert:
            timeout: 20m
            file: 30-assert.yaml
        - assert:
            timeout: 15m
            file: 31-assert.yaml

    - name: verify-restored-data
      try:
        - script:
            content: |
              set -e
              cql() { ${PROVIDER_ROOT_PATH}/test/e2e-cluster/cql.sh $NAMESPACE cass-backup "$1"; }
              cql "SELECT v FROM e2e.kv WHERE k = 'before-backup';" | grep -q kept
              cql "SELECT v FROM e2e.kv WHERE k = 'after-backup';" | grep -q "(0 rows)"

    - name: scheduled-backup
      try:
        - patch:
            file: 40-add-schedule.yaml
        - assert:
            file: 40-assert.yaml

    - name: delete-instance
      try:
        - delete:
            ref:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              name: cass-backup
        - error:
            file: 50-errors.yaml
