---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tls
spec:
  description: |
    Turn on TLS for a running three-node Cassandra cluster with Reaper: write
    data in plaintext, switch to preferTLS, which encrypts the traffic between
    the nodes in three rolling restarts, and check that clients connect with
    and without TLS, verifying the nodes with the CA of the connection Secret.
    Then require TLS, check that plaintext clients are refused and that the
    data survived, that TLS cannot be turned off, and that deleting the
    Instance removes the certificates cert-manager wrote.

  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,k8ssandracluster,cassandradatacenter,certificate,pod -o yaml
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-cassandra
        tail: 100
    - podLogs:
        selector: cassandra.datastax.com/cluster=cass-tls
        container: cassandra
        tail: 100

  steps:
    - name: operator-deployed
      try:
        - script:
            content: kubectl -n provider-system wait --for=condition=available deploy --all --timeout=5m

    - name: create-instance
      try:
        - apply:
            file: 10-create-instance.yaml
        - assert:
            timeout: 20m
            file: 10-assert.yaml
        - script:
            content: |
              ${PROVIDER_ROOT_PATH}/test/e2e-cluster/cql.sh $NAMESPACE cass-tls "
                CREATE KEYSPACE IF NOT EXISTS e2e WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 3};
                CREATE TABLE IF NOT EXISTS e2e.kv (k text PRIMARY KEY, v text);
                CONSISTENCY ALL;
                INSERT INTO e2e.kv (k, v) VALUES ('openeverest', 'tls');"

    - name: prefer-tls
      try:
        - patch:
            file: 20-prefer-tls.yaml
        - assert:
            timeout: 5m
            file: 20-turning-on.yaml
        - assert:
            timeout: 30m
            file: 20-assert.yaml
        - script:
            content: |
              set -eu
              # preferTLS serves clients with and without TLS.
              ${PROVIDER_ROOT_PATH}/test/e2e-cluster/cql.sh $NAMESPACE cass-tls \
                "SELECT v FROM e2e.kv WHERE k = 'openeverest';" | grep -q tls
              CQL_TLS=true ${PROVIDER_ROOT_PATH}/test/e2e-cluster/cql.sh $NAMESPACE cass-tls \
                "SELECT v FROM e2e.kv WHERE k = 'openeverest';" | grep -q tls

    - name: require-tls
      try:
        - patch:
            file: 30-require-tls.yaml
        - assert:
            timeout: 20m
            file: 30-assert.yaml
        - script:
            content: |
              set -eu
              if ${PROVIDER_ROOT_PATH}/test/e2e-cluster/cql.sh $NAMESPACE cass-tls "SELECT now() FROM system.local;"; then
                echo "a plaintext client was served with requireTLS" >&2
                exit 1
              fi
              CQL_TLS=true ${PROVIDER_ROOT_PATH}/test/e2e-cluster/cql.sh $NAMESPACE cass-tls \
                "CONSISTENCY ALL; SELECT v FROM e2e.kv WHERE k = 'openeverest';" | grep -q tls

    - name: tls-stays-on
      try:
        - script:
            content: |
              set -u
              out=$(kubectl -n $NAMESPACE patch instance cass-tls --type merge \
                -p '{"spec":{"parameters":{"tls":{"mode":"disabled"}}}}' 2>&1) && {
                echo "turning TLS off was admitted" >&2
                exit 1
              }
              echo "$out" | grep -q "TLS cannot be turned off"

    - name: delete-instance
      try:
        - delete:
            ref:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              name: cass-tls
        - error:
            file: 40-errors.yaml
