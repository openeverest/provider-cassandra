apiVersion: k8ssandra.io/v1alpha1
kind: K8ssandraCluster
metadata:
  name: cass-tls
spec:
  cassandra:
    config:
      cassandraYaml:
        client_encryption_options:
          enabled: true
          optional: false
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: cass-tls
status:
  (conditions[?type == 'Ready'] | [0].status): 'True'
  (components[?name == 'repair'] | [0].readyReplicas): 1
---
apiVersion: cassandra.datastax.com/v1beta1
kind: CassandraDatacenter
metadata:
  name: dc1-a5b8459f
(status.observedGeneration == metadata.generation): true
status:
  cassandraOperatorProgress: Ready
