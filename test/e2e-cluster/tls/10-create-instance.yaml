# Starts without TLS, so the suite covers turning it on for a running cluster.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: cass-tls
spec:
  providerRef:
    name: provider-cassandra
  version: "5.0"
  components:
    engine:
      type: cassandra
      replicas: 3
      resources:
        requests:
          cpu: 250m
          memory: 1536Mi
        limits:
          cpu: "1"
          memory: 1536Mi
      storage:
        size: 2Gi
      parameters:
        heapInitialSize: 768Mi
        heapMaxSize: 768Mi
    repair:
      type: reaper
