# observedGeneration guards against matching a stale status right after the
# template changes, before the rollout has started.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cass-lifecycle-dc1-0b60c5c2-default-sts
spec:
  replicas: 3
  template:
    spec:
      (containers[?name == 'cassandra'] | [0].image): k8ssandra/cass-management-api:5.0.4-ubi
(status.observedGeneration == metadata.generation): true
status:
  readyReplicas: 3
  updatedReplicas: 3
  (currentRevision == updateRevision): true
