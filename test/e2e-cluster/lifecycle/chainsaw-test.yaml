---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lifecycle
spec:
  description: |
    Run a real Cassandra cluster through its lifecycle: create a one-node 4.1
    Instance and write data, scale out, upgrade to 5.0, scale in, resize, check
    the data survived every step, then delete it and check nothing is left.

  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,k8ssandracluster,cassandradatacenter,statefulset,pod,pvc -o yaml
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-cassandra
        tail: 100
    - podLogs:
        selector: cassandra.datastax.com/cluster=cass-lifecycle
        container: cassandra
        tail: 100

  steps:
    - name: operator-deployed
      try:
        - script:
            content: kubectl -n provider-system wait --for=condition=available deploy --all --timeout=5m

    - name: create-instance
      try:
        - apply:
            file: 10-create-instance.yaml
        - assert:
            timeout: 15m
            file: 10-assert.yaml

    - name: write-data
      try:
        - script:
            content: |
              ${PROVIDER_ROOT_PATH}/test/e2e-cluster/cql.sh $NAMESPACE cass-lifecycle "
                CREATE KEYSPACE IF NOT EXISTS e2e WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};
                CREATE TABLE IF NOT EXISTS e2e.kv (k text PRIMARY KEY, v text);
                INSERT INTO e2e.kv (k, v) VALUES ('openeverest', 'lifecycle');"

    - name: scale-out
      try:
        - patch:
            file: 20-scale-out.yaml
        - assert:
            timeout: 15m
            file: 20-assert.yaml

    - name: upgrade-version
      try:
        - patch:
            file: 30-upgrade-version.yaml
        - assert:
            timeout: 20m
            file: 30-assert.yaml
        - script:
            content: &check-data |
              ${PROVIDER_ROOT_PATH}/test/e2e-cluster/cql.sh $NAMESPACE cass-lifecycle \
                "SELECT v FROM e2e.kv WHERE k = 'openeverest';" | grep -q lifecycle

    - name: scale-in
      try:
        - patch:
            file: 40-scale-in.yaml
        - assert:
            timeout: 15m
            file: 40-assert.yaml
        - script:
            content: *check-data

    - name: resize
      try:
        - patch:
            file: 50-resize.yaml
        - assert:
            timeout: 15m
            file: 50-assert.yaml
        - script:
            content: *check-data

    - name: delete-instance
      try:
        - delete:
            ref:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              name: cass-lifecycle
        - error:
            file: 60-errors.yaml
        - script:
            content: |
              for _ in $(seq 60); do
                [ -z "$(kubectl -n $NAMESPACE get pvc -l cassandra.datastax.com/cluster=cass-lifecycle -o name)" ] && exit 0
                sleep 5
              done
              echo "PVCs of cass-lifecycle were not deleted" >&2
              exit 1
