---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lifecycle
spec:
  description: |
    Run a real Cassandra cluster through its lifecycle: create a three-node 4.1
    Instance and write data, upgrade to 5.0, scale out to four nodes and back
    to three, lose a node, resize, check the data survived every step and the
    Instance phase followed along, check Reaper scheduled repairs and remove
    it, then delete it and check nothing is left.

    It starts at three nodes because k8ssandra-operator raises system keyspace
    replication (capped at 3) without repairing, so growing a smaller cluster
    leaves logins failing on some nodes until system_auth is repaired.

  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,k8ssandracluster,cassandradatacenter,statefulset,pod,pvc -o yaml
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-cassandra
        tail: 100
    - podLogs:
        selector: cassandra.datastax.com/cluster=cass-lifecycle
        container: cassandra
        tail: 100

  steps:
    - name: operator-deployed
      try:
        - script:
            content: kubectl -n provider-system wait --for=condition=available deploy --all --timeout=5m

    - name: create-instance
      try:
        - apply:
            file: 10-create-instance.yaml
        - assert:
            timeout: 20m
            file: 10-assert.yaml

    - name: write-data
      try:
        - script:
            content: |
              ${PROVIDER_ROOT_PATH}/test/e2e-cluster/cql.sh $NAMESPACE cass-lifecycle "
                CREATE KEYSPACE IF NOT EXISTS e2e WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 3};
                CREATE TABLE IF NOT EXISTS e2e.kv (k text PRIMARY KEY, v text);
                CONSISTENCY ALL;
                INSERT INTO e2e.kv (k, v) VALUES ('openeverest', 'lifecycle');"

    - name: upgrade-version
      try:
        - patch:
            file: 20-upgrade-version.yaml
        - assert:
            timeout: 20m
            file: 20-assert.yaml
        - script:
            content: &check-data |
              ${PROVIDER_ROOT_PATH}/test/e2e-cluster/cql.sh $NAMESPACE cass-lifecycle \
                "SELECT v FROM e2e.kv WHERE k = 'openeverest';" | grep -q lifecycle

    - name: scale-out
      try:
        - patch:
            file: 30-scale-out.yaml
        - assert:
            timeout: 5m
            file: 30-updating.yaml
        - assert:
            timeout: 15m
            file: 30-assert.yaml
        - script:
            content: *check-data

    - name: scale-in
      try:
        - patch:
            file: 40-scale-in.yaml
        - assert:
            timeout: 5m
            file: 40-updating.yaml
        - assert:
            timeout: 15m
            file: 40-assert.yaml
        - script:
            content: *check-data

    # cass-operator restarts the node without reporting it in the datacenter
    # status.
    - name: node-failure
      try:
        - script:
            content: kubectl -n $NAMESPACE delete pod cass-lifecycle-dc1-0b60c5c2-default-sts-0 --wait=false
        - assert:
            timeout: 5m
            file: 45-recovering.yaml
        - assert:
            timeout: 15m
            file: 40-assert.yaml
        - script:
            content: *check-data

    - name: resize
      try:
        - patch:
            file: 50-resize.yaml
        - assert:
            timeout: 20m
            file: 50-assert.yaml
        - script:
            content: *check-data

    # Reaper looks for new keyspaces every ten minutes and schedules their
    # repairs.
    - name: repairs-scheduled
      try:
        - script:
            timeout: 15m
            content: |
              for _ in $(seq 84); do
                ${PROVIDER_ROOT_PATH}/test/e2e-cluster/cql.sh $NAMESPACE cass-lifecycle \
                  "SELECT keyspace_name FROM reaper_db.repair_unit_v1;" | grep -qw e2e && exit 0
                sleep 10
              done
              echo "Reaper did not schedule repairs for keyspace e2e" >&2
              exit 1

    # Reaper is a pod of its own, so removing it leaves Cassandra running.
    - name: remove-repair
      try:
        - patch:
            file: 55-remove-repair.yaml
        - error:
            file: 55-errors.yaml
        - assert:
            file: 50-assert.yaml
        - script:
            content: *check-data

    - name: delete-instance
      try:
        - delete:
            ref:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              name: cass-lifecycle
        - error:
            file: 60-errors.yaml
        - script:
            content: |
              for _ in $(seq 60); do
                [ -z "$(kubectl -n $NAMESPACE get pvc -l cassandra.datastax.com/cluster=cass-lifecycle -o name)" ] && exit 0
                sleep 5
              done
              echo "PVCs of cass-lifecycle were not deleted" >&2
              exit 1
