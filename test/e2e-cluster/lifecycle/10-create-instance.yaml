apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: cass-lifecycle
spec:
  providerRef:
    name: provider-cassandra
  version: "4.1"
  components:
    engine:
      type: cassandra
      replicas: 1
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          memory: 2Gi
      storage:
        size: 2Gi
      parameters:
        heapInitialSize: 1Gi
        heapMaxSize: 1Gi
