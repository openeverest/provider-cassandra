# Sized so four nodes (during scale-out) fit a GitHub-hosted runner.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: cass-lifecycle
spec:
  providerRef:
    name: provider-cassandra
  version: "4.1"
  components:
    engine:
      type: cassandra
      replicas: 3
      resources:
        requests:
          cpu: 250m
          memory: 1536Mi
        limits:
          memory: 1536Mi
      storage:
        size: 2Gi
      parameters:
        heapInitialSize: 768Mi
        heapMaxSize: 768Mi
