apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-cass-admission
spec:
  providerRef:
    name: provider-cassandra
  components:
    engine:
      type: cassandra
      replicas: 3
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          memory: 2Gi
      storage:
        size: 2Gi
      parameters:
        heapInitialSize: 512Mi
        heapMaxSize: 1Gi
  backup:
    enabled: true
    classRef:
      name: test-admission-other-provider
    storages:
      - storageRef:
          name: test-admission-s3
