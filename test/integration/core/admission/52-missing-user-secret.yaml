apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-cass-nosecret
spec:
  providerRef:
    name: provider-cassandra
  userSecretRef:
    name: test-admission-missing-users
  components:
    engine:
      type: cassandra
      replicas: 3
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          memory: 2Gi
      storage:
        size: 1Gi
