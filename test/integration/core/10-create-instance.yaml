apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: cass-core
spec:
  providerRef:
    name: provider-cassandra
  version: "4.1"
  topology:
    type: singleDatacenter
  components:
    engine:
      type: cassandra
      replicas: 3
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          memory: 2Gi
      storage:
        size: 1Gi
      parameters:
        heapInitialSize: 512Mi
        heapMaxSize: 1Gi
