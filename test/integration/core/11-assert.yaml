apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: cass-core
status:
  phase: Ready
  connectionSecretRef:
    name: cass-core-conn
  # k8ssandra-operator is not deployed, so the component has no pods.
  components:
    - name: engine
      selector: core.openeverest.io/component=engine,core.openeverest.io/instance=cass-core
      replicas: 0
      readyReplicas: 0
---
apiVersion: v1
kind: Secret
metadata:
  name: cass-core-conn
data:
  (base64_decode(type)): cassandra
  (base64_decode(host)): cass-core-dc1-32dfcac1-service
  (base64_decode(port)): "9042"
  (base64_decode(username)): cass-core-superuser
  (base64_decode(password)): s3cr3t
