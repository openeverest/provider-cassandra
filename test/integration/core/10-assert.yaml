# The datacenter name is "dc1-" plus the FNV-32a hash of the Instance name
# (resolveDatacenterName); it must never change for a live cluster.
apiVersion: k8ssandra.io/v1alpha1
kind: K8ssandraCluster
metadata:
  name: cass-core
spec:
  cassandra:
    metadata:
      pods:
        labels:
          core.openeverest.io/component: engine
          core.openeverest.io/instance: cass-core
          core.openeverest.io/provider: provider-cassandra
    serverType: cassandra
    serverVersion: 4.1.9
    serverImage: k8ssandra/cass-management-api:4.1.9-ubi
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 500m
        memory: 2Gi
    # Pods prefer separate nodes instead of cass-operator's required one per node.
    softPodAntiAffinity: true
    racks:
      - name: default
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      core.openeverest.io/component: engine
                      core.openeverest.io/instance: cass-core
                      core.openeverest.io/provider: provider-cassandra
    storageConfig:
      cassandraDataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    config:
      jvmOptions:
        heap_initial_size: 512Mi
        heap_max_size: 1Gi
    datacenters:
      - metadata:
          name: dc1-32dfcac1
        size: 3
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: cass-core
status:
  phase: Provisioning
