# The datacenter name is "dc1-" plus the FNV-32a hash of the Instance name
# (resolveDatacenterName); it must never change for a live cluster.
apiVersion: k8ssandra.io/v1alpha1
kind: K8ssandraCluster
metadata:
  name: cass-core
spec:
  cassandra:
    serverType: cassandra
    serverVersion: 4.1.9
    serverImage: k8ssandra/cass-management-api:4.1.9-ubi
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 2Gi
    storageConfig:
      cassandraDataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    config:
      jvmOptions:
        heap_initial_size: 512Mi
        heap_max_size: 1Gi
    datacenters:
      - metadata:
          name: dc1-32dfcac1
        size: 3
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: cass-core
status:
  phase: Provisioning
