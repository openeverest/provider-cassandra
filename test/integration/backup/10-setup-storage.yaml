apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: access
  AWS_SECRET_ACCESS_KEY: secret
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: s3-storage
spec:
  type: s3
  s3:
    bucket: cassandra-backups
    region: us-east-1
    endpointURL: https://s3.example.com:9000
    verifyTLS: false
    credentialsSecretRef:
      name: s3-credentials
