apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: access
  AWS_SECRET_ACCESS_KEY: secret
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: s3-storage
spec:
  backupStorageClassRef:
    name: s3
  location:
    bucket: cassandra-backups
  parameters:
    region: us-east-1
    endpointURL: https://s3.example.com:9000
    implementation: other
  authentication:
    mode: AccessKey
    credentialsSecretRef:
      name: s3-credentials
  tls:
    insecureSkipVerify: true
