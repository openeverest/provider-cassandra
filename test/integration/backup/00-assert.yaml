# The provider must be deployed and ready, and its chart must have installed
# the Medusa BackupClass, which the provider claims (Accepted) and core then
# publishes as Compatible with this provider.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-cassandra
  namespace: provider-system
status:
  readyReplicas: 1
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupClass
metadata:
  name: medusa
spec:
  executionMode: ProviderManaged
  backupStorageClasses:
    - name: s3
      authModes:
        - AccessKey
  providerManaged:
    providerRef:
      name: provider-cassandra
status:
  (conditions[?type == 'Accepted']):
    - status: 'True'
  providers:
    - name: provider-cassandra
      compatibility: Compatible
