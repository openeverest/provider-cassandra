# No operator runs here, so the cluster never reports ready, and the backup
# waits rather than start a MedusaBackupJob that would fail on every node.
apiVersion: backup.openeverest.io/v1alpha1
kind: Backup
metadata:
  name: cass-backup-manual
status:
  state: Pending
  message: Waiting for the Cassandra cluster to finish applying changes before starting the backup
