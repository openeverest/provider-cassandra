# SingleDatacenter topology definition.
# Deploys a single Cassandra datacenter (one K8ssandraCluster with one
# CassandraDatacenter). backupAgent (Medusa), monitoring (Prometheus) and repair
# (Reaper) are optional add-ons.
#
# config.components: which components are used and their defaults.
# ui: rendering hints for the frontend form.

config:
    components:
        engine:
            defaults:
                replicas: 3
            supportedFields:
                properties:
                    version: {}
                    image: {}
                    storage: {}
                    resources: {}
                    replicas: {minimum: 1}
                    # K8ssandraCluster has no schedulerName or topologySpreadConstraints,
                    # and cass-operator drops podAffinity.
                    schedulingPolicy:
                        properties:
                            nodeSelector: {}
                            tolerations: {}
                            affinity:
                                properties:
                                    nodeAffinity: {}
                                    podAntiAffinity: {}
        # Medusa runs as a sidecar of the Cassandra pods.
        backupAgent:
            optional: true
            supportedFields:
                properties: {}
        # Only adds a ServiceMonitor; it runs no pods.
        monitoring:
            optional: true
            supportedFields:
                properties: {}
        # Reaper runs as its own pod and schedules repairs for every
        # non-system keyspace. ReaperTemplate has no nodeSelector, schedulerName
        # or topologySpreadConstraints.
        repair:
            optional: true
            supportedFields:
                properties:
                    type: {}
                    version: {}
                    image: {}
                    resources: {}
                    schedulingPolicy:
                        properties:
                            tolerations: {}
                            affinity: {}
ui:
    sections:
        databaseVersion:
            label: Database Version
            description: Provide the information about the database version you want to use.
            components:
                version:
                    uiType: select
                    path: spec.version
                    fieldParams:
                        label: Database Version
                        optionsPath: spec.versions
                        optionsPathConfig:
                            labelPath: name
                            valuePath: name
                        modes:
                            edit:
                                disabled: true
                            restore:
                                disabled: true
                    validation:
                        required: true
        resources:
            label: Resources
            description: Configure the resources your database will have access to.
            components:
                nodes:
                    uiType: group
                    components:
                        numberOfNodes:
                            path: spec.components.engine.replicas
                            uiType: number
                            fieldParams:
                                label: Number of nodes
                                defaultValue: 3
                            validation:
                                required: true
                                min: 1
                                int: true
                                modes:
                                    edit:
                                        celExpressions:
                                            - celExpr: "!(spec.components.engine.replicas == 1 && original.spec.components.engine.replicas > 1)"
                                              message: Cannot scale down to a single node
                        resources:
                            uiType: group
                            groupType: line
                            components:
                                cpu:
                                    path: spec.components.engine.resources.limits.cpu
                                    uiType: quantity
                                    fieldParams:
                                        label: CPU
                                        unitLabel: CPU
                                        defaultValue: 1
                                    validation:
                                        min: 1
                                        # Millicore precision, the finest Kubernetes keeps.
                                        multipleOf: 0.001
                                        required: true
                                memory:
                                    path: spec.components.engine.resources.limits.memory
                                    uiType: quantity
                                    fieldParams:
                                        label: Memory
                                        defaultValue: 4
                                        unit: Gi
                                    validation:
                                        min: 1
                                        required: true
                                disk:
                                    path: spec.components.engine.storage.size
                                    uiType: quantity
                                    fieldParams:
                                        label: Disk
                                        defaultValue: 25
                                        unit: Gi
                                    validation:
                                        min: 1
                                        int: true
                                        required: true
                                        modes:
                                            edit:
                                                celExpressions:
                                                    - celExpr: double(spec.components.engine.storage.size) >= double(original.spec.components.engine.storage.size)
                                                      message: Disk size cannot be decreased
                    componentsOrder:
                        - numberOfNodes
                        - resources
        advanced:
            label: Advanced configuration
            description: Configure advanced settings for your database.
            components:
                storageClass:
                    uiType: select
                    path: spec.components.engine.storage.storageClass
                    fieldParams:
                        label: Storage class
                        modes:
                            edit:
                                disabled: true
                            restore:
                                disabled: true
                    validation:
                        required: true
                    dataSource:
                        provider: storageClasses
                heapSize:
                    uiType: group
                    groupType: line
                    components:
                        heapInitialSize:
                            path: spec.components.engine.parameters.heapInitialSize
                            uiType: quantity
                            fieldParams:
                                label: Initial heap size
                                unit: Gi
                            validation:
                                min: 0.5
                                celExpressions:
                                    # The JVM refuses to start when -Xms exceeds -Xmx, as Validate checks.
                                    - celExpr: "!has(spec.components.engine.parameters.heapInitialSize) || !has(spec.components.engine.parameters.heapMaxSize) || double(spec.components.engine.parameters.heapInitialSize) <= double(spec.components.engine.parameters.heapMaxSize)"
                                      message: Initial heap size cannot be greater than max heap size
                        heapMaxSize:
                            path: spec.components.engine.parameters.heapMaxSize
                            uiType: quantity
                            fieldParams:
                                label: Max heap size
                                unit: Gi
                            validation:
                                min: 0.5
                                celExpressions:
                                    - celExpr: "!has(spec.components.engine.parameters.heapInitialSize) || !has(spec.components.engine.parameters.heapMaxSize) || double(spec.components.engine.parameters.heapInitialSize) <= double(spec.components.engine.parameters.heapMaxSize)"
                                      message: Initial heap size cannot be greater than max heap size
            componentsOrder:
                - storageClass
                - heapSize
        repairs:
            label: Repairs
            description: Without regular repairs, deleted data can reappear once gc_grace_seconds (10 days by default) has passed.
            components:
                reaper:
                    uiType: group
                    groupType: toggleable
                    label: Scheduled repairs
                    description: Runs Cassandra Reaper next to the cluster. It schedules repairs for every non-system keyspace, incremental on Cassandra 4 and later.
                    components:
                        # Writes spec.components.repair.type so the toggle owns
                        # it: switching off removes the whole repair component.
                        type:
                            uiType: select
                            path: spec.components.repair.type
                            fieldParams:
                                label: Repair service
                                defaultValue: reaper
                                readOnly: true
                                options:
                                    - label: Cassandra Reaper
                                      value: reaper
                            validation:
                                required: true
            componentsOrder:
                - reaper
    sectionsOrder:
        - databaseVersion
        - resources
        - advanced
        - repairs
