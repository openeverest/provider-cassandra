# Default values for provider-cassandra.

# -- Number of replicas for the provider deployment
replicaCount: 1

image:
  # -- Container image repository
  repository: ghcr.io/openeverest/provider-cassandra
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the chart
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- Automount API credentials for the service account
  automountServiceAccountToken: true
  # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # -- Specifies whether RBAC resources should be created
  create: true

# -- Annotations to add to the deployment pods
podAnnotations: {}

# -- Labels to add to the deployment pods
podLabels: {}

podSecurityContext:
  # -- Run as non-root
  runAsNonRoot: true
  # -- Security context fsGroup
  fsGroup: 65534

securityContext:
  # -- Disallow privilege escalation
  allowPrivilegeEscalation: false
  # -- Drop all capabilities
  capabilities:
    drop:
      - ALL
  # -- Read-only root filesystem
  readOnlyRootFilesystem: true
  # -- Run as non-root user
  runAsNonRoot: true
  # -- Run as user ID
  runAsUser: 65534

service:
  # -- Service type
  type: ClusterIP
  # -- Service port for the HTTP server (health endpoints)
  port: 8082
  # -- The address the metrics endpoint binds to. Use "0" to disable.
  metricsBindAddress: ":8081"

# -- Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# -- Deployment update strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 25%
    maxSurge: 25%

# -- Number of old ReplicaSets to retain
revisionHistoryLimit: 1

# -- Termination grace period in seconds
terminationGracePeriodSeconds: 10

# -- Topology spread constraints for pod scheduling
topologySpreadConstraints: []

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

provider:
  # -- The name to register for the Provider custom resource
  name: provider-cassandra
  # -- Short provider identifier, used as the prefix of preset names
  # (e.g. 'cassandra-singledatacenter').
  shortName: cassandra

openeverest:
  # -- Annotations to add to the objects of this chart that OpenEverest
  # interprets: the Provider, its BackupClass and the presets. A key under
  # openeverest.io/ belongs to the chart and to OpenEverest, and fails the
  # render.
  annotations: {}
    # For example, to have Argo CD apply these objects before the provider's
    # Deployment and the bundled operator:
    # argocd.argoproj.io/sync-wave: "-1"

# -- ClusterInstancePresets installed with the provider: well-known starting
# points users pick when they create an Instance in any namespace. Each entry
# has a 'name' (prefixed with provider.shortName), 'enabled', and a 'spec' (an
# Instance spec; providerRef is set by the chart). Presets are cluster-scoped,
# so a spec must not reference namespaced objects such as Secrets or backup
# storages. version is the provider's default version bundle; keep it in step
# with definition/versions.yaml (a unit test checks it).
presets:
  - name: singledatacenter
    enabled: true
    spec:
      version: "5.0"
      topology:
        type: singleDatacenter
      components:
        engine:
          type: cassandra
          replicas: 3
          resources:
            limits:
              cpu: "1"
              memory: 4Gi
          storage:
            size: 25Gi

# -- Global values shared with the bundled operator subchart.
global:
  # -- Make the k8ssandra-operator watch and reconcile K8ssandraClusters in ALL
  # namespaces. Required because OpenEverest Instances (and the K8ssandraClusters
  # the provider creates for them) can live in any namespace. Set to false only
  # when the operator and all Instances share a single namespace.
  clusterScoped: true

# -- Values for the bundled k8ssandra-operator subchart (deploys the operator
# and its CRDs: k8ssandra, cass-operator and medusa).
# See https://github.com/k8ssandra/k8ssandra-operator/tree/main/charts/k8ssandra-operator
# NOTE: k8ssandra-operator uses admission webhooks that require cert-manager to
# be installed in the cluster. Install cert-manager before installing this chart.
operator:
  # -- Deploy the bundled operator. Set to false to use an externally managed operator.
  enabled: true
  # -- Keep the operator chart's CRD upgrader job off: it cannot find its chart
  # under the `operator` alias and fails every upgrade. The provider's
  # pre-upgrade hook upgrades the operator CRDs instead.
  disableCrdUpgraderJob: true
  cass-operator:
    # -- Skip the template-time cert-manager presence check. cass-operator
    # self-signs its webhook certificates; the parent operator still requires
    # cert-manager for its own webhook certificate.
    disableCertManagerCheck: true

# -- Additional environment variables to set on the provider container
extraEnv: []
# - name: MY_VAR
#   value: "my-value"

# -- Additional volume mounts to add to the provider container
extraVolumeMounts: []

# -- Additional volumes to add to the pod
extraVolumes: []

admission:
  # -- PEM serving certificate for the Instance admission webhook. Left empty,
  # the chart generates one and keeps it across upgrades.
  certs:
    tls.crt: ""
    tls.key: ""
    ca.crt: ""
  certManager:
    # -- Issue the serving certificate with cert-manager, which must be installed.
    enabled: false

compatibility:
  acknowledge:
    # -- Install and start the provider even though the OpenEverest in the
    # cluster does not serve the OpenEverest this chart is built for. Otherwise
    # a Helm install fails before anything is applied, and a build applied
    # without that check (Argo CD, pre-rendered manifests) stays unready until
    # OpenEverest serves it. The chart writes it on the Provider, where the
    # provider reads it at startup. Set it to the version of OpenEverest the
    # cluster runs, which the error names. It holds on that release and the
    # later ones that keep its contract, such as its patch releases, and
    # expires with the first OpenEverest release that changes the contract,
    # which is checked again. Set ahead of an upgrade, it does nothing until
    # that release is installed.
    coreVersion: ""

# -- Leader election configuration
leaderElection:
  # -- Enable leader election (recommended for HA deployments)
  enabled: true

# TODO: Add values for your operator subchart dependency, e.g.:
# my-operator:
#   replicaCount: 1
#   rbac:
#     create: true
